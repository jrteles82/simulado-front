<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#" role="button" (click)="$event.preventDefault()">
          <i class="fas fa-bars"></i>
        </a>
      </li>
    </ul>

    <ul class="navbar-nav ml-auto">
      <li class="nav-item d-flex align-items-center">
        <app-auth-button></app-auth-button>
      </li>
    </ul>
  </nav>

  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a routerLink="/admin/questions" class="brand-link">
      <span class="brand-text font-weight-light">Simulado Admin</span>
    </a>

    <div class="sidebar">
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
          <li class="nav-item">
            <a routerLink="/admin/questions" routerLinkActive="active" class="nav-link" [routerLinkActiveOptions]="{ exact: false }">
              <i class="nav-icon fas fa-question-circle"></i>
              <p>Questões</p>
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/admin/categories" routerLinkActive="active" class="nav-link" [routerLinkActiveOptions]="{ exact: false }">
              <i class="nav-icon fas fa-list"></i>
              <p>Categorias</p>
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/admin/users" routerLinkActive="active" class="nav-link" [routerLinkActiveOptions]="{ exact: false }">
              <i class="nav-icon fas fa-users"></i>
              <p>Usuários</p>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <section class="content pt-3">
      <div class="container-fluid">
        <router-outlet></router-outlet>
      </div>
    </section>
  </div>

  <footer class="main-footer text-sm text-center">
    <strong>Simulado FGV</strong>
    <span class="ml-2">Painel Administrativo</span>
  </footer>
</div>
