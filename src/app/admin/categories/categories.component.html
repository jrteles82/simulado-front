<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h3 class="card-title mb-0">Categorias</h3>
        <a routerLink="/admin/categories/new" class="btn btn-primary btn-sm">
          <i class="fas fa-plus mr-1"></i> Nova categoria
        </a>
      </div>
      <div class="card-body p-0">
        <div *ngIf="!rows.length" class="p-3 text-muted">Nenhuma categoria cadastrada.</div>
        <div *ngIf="rows.length" class="table-responsive">
          <table class="table table-hover mb-0">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Slug</th>
                <th class="text-right">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let c of rows">
                <td>{{ c.name }}</td>
                <td>{{ c.slug }}</td>
                <td class="text-right">
                  <a [routerLink]="['/admin/categories', c.id]" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-edit mr-1"></i> Editar
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
