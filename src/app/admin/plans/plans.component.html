<div class="card shadow-sm">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h2 class="h5 mb-0">Planos</h2>
    <button class="btn btn-primary btn-sm" (click)="newPlan()">
      <i class="fas fa-plus mr-1"></i>
      Novo plano
    </button>
  </div>
  <div class="card-body">
    <div *ngIf="loading()" class="alert alert-info" role="status">Carregando planos…</div>
    <div *ngIf="!loading() && error()" class="alert alert-danger" role="alert">{{ error() }}</div>

    <div *ngIf="!loading() && !error()">
      <div *ngIf="plans().length; else emptyState" class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Slug</th>
              <th>Preço</th>
              <th>Duração</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let plan of plans()">
              <td>{{ plan.name }}</td>
              <td><code>{{ plan.slug }}</code></td>
              <td>{{ formatPrice(plan) }}</td>
              <td>{{ plan.durationDays }} dias</td>
              <td class="text-right">
                <button class="btn btn-outline-secondary btn-sm mr-2" (click)="edit(plan)">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn btn-outline-danger btn-sm" (click)="remove(plan)">
                  <i class="fas fa-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <ng-template #emptyState>
        <div class="alert alert-warning mb-0">Nenhum plano cadastrado.</div>
      </ng-template>
    </div>
  </div>
</div>
