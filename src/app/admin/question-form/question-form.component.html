<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title mb-0">{{ id ? 'Editar questão' : 'Nova questão' }}</h3>
      </div>

      <form class="card-body" (ngSubmit)="save()">
        <div class="form-group">
          <label for="q-category">Categoria</label>
          <select id="q-category" class="form-control" [(ngModel)]="form.categoryId" name="categoryId" required>
            <option *ngFor="let c of cats" [value]="c.id">{{ c.name }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="q-stem">Enunciado</label>
          <textarea
            id="q-stem"
            class="form-control"
            rows="4"
            [(ngModel)]="form.stem"
            name="stem"
            required
          ></textarea>
        </div>

        <div class="form-group">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="mb-0">Alternativas</label>
            <button type="button" class="btn btn-outline-primary btn-sm" (click)="addOpt()">
              <i class="fas fa-plus mr-1"></i> Adicionar
            </button>
          </div>
          <div *ngFor="let opt of form.options; let i = index" class="input-group mb-2">
            <div class="input-group-prepend">
              <div class="input-group-text">
                <input
                  type="radio"
                  class="form-check-input mt-0"
                  [value]="i"
                  [(ngModel)]="form.correctIndex"
                  name="correctIndex"
                  required
                />
              </div>
            </div>
            <input
              class="form-control"
              [(ngModel)]="form.options[i]"
              [name]="'opt' + i"
              placeholder="Alternativa {{ i + 1 }}"
              required
            />
            <div class="input-group-append">
              <button
                type="button"
                class="btn btn-outline-danger"
                (click)="removeOpt(i)"
                [disabled]="form.options.length <= 2"
              >
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>
          <small class="form-text text-muted">Selecione a alternativa correta marcando o botão à esquerda.</small>
        </div>

        <div class="form-group">
          <label for="q-explanation">Explicação</label>
          <textarea
            id="q-explanation"
            class="form-control"
            rows="3"
            [(ngModel)]="form.explanation"
            name="explanation"
            required
          ></textarea>
        </div>

        <div class="d-flex justify-content-between">
          <button type="button" class="btn btn-secondary" routerLink="/admin/questions">
            Cancelar
          </button>
          <div>
            <button type="submit" class="btn btn-primary mr-2">Salvar</button>
            <button type="button" *ngIf="id" class="btn btn-danger" (click)="del()">Excluir</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
