<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h3 class="card-title mb-0">Usuários</h3>
      </div>
      <div class="card-body">
        <div *ngIf="loading" class="text-muted">Carregando...</div>
        <div *ngIf="!loading && error" class="alert alert-danger mb-0">{{ error }}</div>

        <ng-container *ngIf="!loading && !error">
          <table *ngIf="users.length; else emptyState" class="table table-hover table-striped">
            <thead>
              <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Perfil</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let user of users">
                <td>
                  <div class="d-flex align-items-center">
                    <img *ngIf="user.picture" [src]="user.picture" alt="avatar" class="img-circle elevation-1 mr-2" width="32" height="32">
                    <span>{{ user.name || '—' }}</span>
                  </div>
                </td>
                <td>{{ user.email }}</td>
                <td><span class="badge badge-primary text-uppercase">{{ user.role }}</span></td>
              </tr>
            </tbody>
          </table>
        </ng-container>

        <ng-template #emptyState>
          <p class="text-muted mb-0">Nenhum usuário cadastrado.</p>
        </ng-template>
      </div>
    </div>
  </div>
</div>
