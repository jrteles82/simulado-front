<ng-container *ngIf="auth.user$ | async as user; else loggedOut">
  <div class="dropdown">
    <button
      class="btn btn-outline-light dropdown-toggle user-trigger"
      type="button"
      data-bs-toggle="dropdown"
      aria-expanded="false">
      <img
        *ngIf="user.picture; else initials"
        [src]="user.picture"
        alt="avatar"
        width="28"
        height="28"
        class="rounded-circle mr-2" />
      <ng-template #initials>
        <span class="user-initials mr-2">{{ (user.name || user.email) | slice:0:1 | uppercase }}</span>
      </ng-template>
      <span>{{ user.name || user.email }}</span>
    </button>
    <div class="dropdown-menu dropdown-menu-right shadow">
      <span class="dropdown-item-text text-muted small">{{ user.email }}</span>
      <div class="dropdown-divider"></div>
      <a routerLink="/area-do-candidato" class="dropdown-item">
        <i class="fas fa-user mr-2"></i> Minha conta
      </a>
      <a routerLink="/simulado" class="dropdown-item">
        <i class="fas fa-play mr-2"></i> Simulados
      </a>
      <div class="dropdown-divider"></div>
      <button type="button" class="dropdown-item text-danger" (click)="logout()">
        <i class="fas fa-sign-out-alt mr-2"></i> Sair
      </button>
    </div>
  </div>
</ng-container>

<ng-template #loggedOut>
  <button type="button" class="btn btn-primary" (click)="login()">Entrar com Google</button>
</ng-template>
