<div class="landing-navbar" [class.mobile]="isMobile()">
  <div class="container py-3 d-flex align-items-center justify-content-between">
    <a class="brand" [routerLink]="brandLink">
      <span class="brand-mark">{{ brandMark }}</span>
      <span>{{ brandLabel }}</span>
    </a>

    <nav class="desktop-nav d-flex align-items-center" *ngIf="!isMobile()">
      <ng-container *ngFor="let item of navItems">
        <a
          class="nav-link"
          *ngIf="item.routerLink; else external"
          [routerLink]="item.routerLink"
          [routerLinkActive]="'active'"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          [fragment]="item.fragment"
          (click)="handleRouterLinkClick($event, item)">
          {{ item.label }}
        </a>
        <ng-template #external>
          <a class="nav-link" *ngIf="item.href" [href]="item.href">{{ item.label }}</a>
        </ng-template>
      </ng-container>
    </nav>

    <div class="nav-actions">
      <ng-container *ngIf="!isMobile()">
        <a
          *ngIf="mobileCta"
          class="btn btn-sm btn-outline-light"
          [routerLink]="mobileCta.routerLink"
          (click)="handleCtaClick($event)">
          {{ mobileCta.label }}
        </a>
        <app-auth-button
          *ngIf="showAuthButton"
          (loggedOut)="handleLoggedOut()"
        ></app-auth-button>
      </ng-container>

      <button
        type="button"
        class="btn btn-outline-light btn-sm mobile-toggle"
        *ngIf="isMobile()"
        (click)="toggleMobileNav()">
        <i class="fas" [ngClass]="mobileMenuOpen ? 'fa-times' : 'fa-bars'"></i>
      </button>
    </div>

    <!-- <a
      *ngIf="isMobile()"
      class="btn btn-sm btn-primary mobile-cta"
      [routerLink]="mobileCta.routerLink"
      (click)="handleCtaClick($event)">
      {{ mobileCta.label }}
    </a> -->
  </div>

  <div class="mobile-menu" *ngIf="isMobile() && mobileMenuOpen">
    <div class="mobile-links">
      <ng-container *ngFor="let item of navItems">
        <a
          class="nav-link"
          *ngIf="item.routerLink; else mobileExternal"
          [routerLink]="item.routerLink"
          [routerLinkActive]="'active'"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          [fragment]="item.fragment"
          (click)="handleRouterLinkClick($event, item)">
          {{ item.label }}
        </a>
        <ng-template #mobileExternal>
          <a class="nav-link" *ngIf="item.href" [href]="item.href" (click)="handleNavClick()">{{ item.label }}</a>
        </ng-template>
      </ng-container>
    </div>

    <div class="mobile-actions">
      <app-auth-button
        *ngIf="showAuthButton"
        variant="mobile"
        (loggedOut)="handleLoggedOut()"
        (navigated)="handleNavClick()"
      ></app-auth-button>
    </div>
  </div>
</div>
